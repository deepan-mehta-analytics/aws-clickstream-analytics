# ── Build system ──────────────────────────────────────────────
[build-system]                                          # how pip builds the package
requires = ["setuptools>=68"]                           # setuptools as the build backend
build-backend = "setuptools.build_meta"                 # standard PEP 517 entry point

# ── Project metadata and pinned dependencies ──────────────────
[project]                                               # package description
name = "clickstream"                                    # import name of the package
version = "0.1.0"                                       # matches clickstream.__version__
requires-python = ">=3.11"                              # zoneinfo + modern typing
dependencies = [                                        # runtime libraries, pinned to verified versions
    "pandas==2.3.3",                                    # dataframes
    "pyarrow==16.1.0",                                  # Parquet read/write
    "duckdb==1.5.2",                                    # local SQL engine for the summaries
    "tzdata==2026.2",                                   # timezone database (Europe/Warsaw) on every OS
]

[project.optional-dependencies]                         # extra tools for development
dev = [                                                 # development-only tools, pinned
    "pytest==9.0.2",                                    # test runner
    "ruff==0.15.12",                                    # Python linter
    "pyyaml==6.0.3",                                    # parses CloudFormation templates in the infra tests
    "cfn-lint==1.57.0",                                 # validates CloudFormation templates against the AWS spec
    "boto3==1.42.84",                                   # AWS SDK for the Lambda tests (same version as the Glue 6.0 runtime)
]

spark = [                                               # local Spark for the Glue job tests (needs Java 17 or 21)
    "pyspark==4.1.1",                                   # same Spark version as AWS Glue 6.0
]

# ── Package discovery ─────────────────────────────────────────
[tool.setuptools.packages.find]                         # find packages automatically
where = ["src"]                                         # packages live under src/

# ── Test settings ─────────────────────────────────────────────
[tool.pytest.ini_options]                               # pytest configuration
testpaths = ["tests"]                                   # where tests live
markers = ["full_file: needs the real UCI file in data/"]  # marker for the reconciliation test

# ── Lint settings ─────────────────────────────────────────────
[tool.ruff]                                             # ruff configuration
line-length = 160                                       # room for the mandatory inline comments
