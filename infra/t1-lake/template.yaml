          SerdeInfo:                                       # serializer
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe  # Parquet SerDe
          Columns:                                         # data columns, VISIT_COLUMNS order minus visit_month (tested)
            - { Name: visit_id, Type: bigint }             # visit
            - { Name: visit_date, Type: date }             # real date (visits never cross midnight)
            - { Name: country_code, Type: bigint }         # country
            - { Name: device_type_synthetic, Type: string }  # synthetic device
            - { Name: visit_start_time_synthetic, Type: timestamp }  # first click time
            - { Name: visit_end_time_synthetic, Type: timestamp }  # last click time
            - { Name: visit_length_seconds_synthetic, Type: bigint }  # duration
            - { Name: clicks_in_visit, Type: bigint }      # number of clicks
            - { Name: products_viewed, Type: bigint }      # distinct products
