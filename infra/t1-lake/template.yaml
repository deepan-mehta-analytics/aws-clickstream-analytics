  # ── Athena workgroup ────────────────────────────────────────
  AthenaWorkGroup:                                         # where the owner's queries run
    Type: AWS::Athena::WorkGroup                           # Athena workgroup
    Properties:                                            # settings
      Name: !Sub "${AWS::StackName}-workgroup"             # stack-scoped name
      State: ENABLED                                       # usable
      RecursiveDeleteOption: true                          # stack delete also removes saved queries/history
      WorkGroupConfiguration:                              # enforced settings
        EnforceWorkGroupConfiguration: true                # clients cannot override
        BytesScannedCutoffPerQuery: 1073741824             # 1 GB per query, a cost fuse
        PublishCloudWatchMetricsEnabled: false             # no metric charges
        ResultConfiguration:                               # query results
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"  # expire after 1 day
          EncryptionConfiguration:                         # encryption
            EncryptionOption: SSE_S3                       # S3-managed keys

Outputs:                                                   # read by scripts/t1a-*.ps1
  BronzeBucketName: { Value: !Ref BronzeBucket }           # raw rows
  SilverBucketName: { Value: !Ref SilverBucket }           # Silver + reports
  GoldBucketName: { Value: !Ref GoldBucket }               # Gold
  AthenaResultsBucketName: { Value: !Ref AthenaResultsBucket }  # query results
  IngestFunctionName: { Value: !Ref IngestFunction }       # Lambda
  GlueJobName: { Value: !Ref BuildSilverGoldJob }          # Glue job
  WorkGroupName: { Value: !Ref AthenaWorkGroup }           # Athena workgroup
  DatabaseName: { Value: !Ref ClickstreamDatabase }        # clickstream_t1
